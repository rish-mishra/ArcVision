[pytest]
# Scopes bare `pytest`/`pytest -q` (no path argument) to this project's own
# tests/ directory. Without this, pytest's default discovery recurses from
# the current working directory and picks up any other test suite living
# alongside this repo (e.g. an unrelated sibling project's own tests/
# folder) -- if that project happens to have same-named test modules (it
# does: test_geometry.py, test_tracking.py), pytest's package-import
# resolution collides between the two identically-named `tests` packages
# and the whole run aborts with ModuleNotFoundError before a single test
# executes. Not a bug in this project's own test suite.
testpaths = tests
